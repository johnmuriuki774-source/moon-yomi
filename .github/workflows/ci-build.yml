name: CI Build
on:
  push:
    branches:
      - "ui/overhaul"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Install Android command line tools and SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip lib32stdc++6 lib32z1
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          mkdir -p $HOME/Android/cmdline-tools
          unzip cmdline-tools.zip -d $HOME/Android/cmdline-tools
          mkdir -p $HOME/Android/Sdk/cmdline-tools
          mv $HOME/Android/cmdline-tools/cmdline-tools $HOME/Android/Sdk/cmdline-tools/latest || true
          export ANDROID_HOME=$HOME/Android/Sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --sdk_root=${ANDROID_HOME} --licenses || true
          sdkmanager --sdk_root=${ANDROID_HOME} 'platform-tools' 'platforms;android-33' 'build-tools;33.0.2' || true

      - name: Build (assembleDebug)
        env:
          ANDROID_SDK_ROOT: ${{ env.HOME }}/Android/Sdk
        run: ./gradlew assembleDebug --no-daemon
